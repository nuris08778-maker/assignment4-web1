<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 3</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 700px;">
  <h1 class="mb-4">Contact Us</h1>
  <form id="contactForm" action="#" method="post" novalidate>
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" placeholder="Your name" required minlength="2">
        <div class="valid-feedback">Looks good!</div>
        <div class="invalid-feedback">Name is required (at least 2 characters).</div>
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
        <div class="valid-feedback">Looks good!</div>
        <div class="invalid-feedback">Email is required and must be valid.</div>
      </div>
    </div>
    <div class="mb-3">
      <label for="message" class="form-label">Message</label>
      <textarea class="form-control" id="message" rows="5" placeholder="Write your message here" required minlength="10"></textarea>
      <div class="valid-feedback">Looks good!</div>
      <div class="invalid-feedback">Message is required (at least 10 characters).</div>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>

<script>
const form = document.getElementById("contactForm");
const inputs = form.querySelectorAll("input, textarea");

function mark(el) {
  const ok = el.checkValidity();
  el.classList.toggle("is-valid", ok);
  el.classList.toggle("is-invalid", !ok);
}

inputs.forEach(function (el) {
  el.addEventListener("input", function () {
    mark(el);
  });
});

form.addEventListener("submit", function (e) {
  e.preventDefault();
  inputs.forEach(mark);
  if (form.checkValidity()) {
    alert("Form sent successfully!");
    form.reset();
    inputs.forEach(function (el) {
      el.classList.remove("is-valid", "is-invalid");
    });
  }
});
</script>
</body>
</html>
